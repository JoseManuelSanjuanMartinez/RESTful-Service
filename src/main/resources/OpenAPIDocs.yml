
openapi: 3.0.3
info:
  title: "API de catálogo de Bancos"
  version: 1.0.0
  description: "API REST que permite gestionar un catálogo de bancos, junto con sus hipotecas."

servers:
  - url: http://localhost:8080

components:
  schemas:
    Bank:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          example: "ING Bank"
        swiftBicCode:
          type: string
          example: "INGDESMM"
        web:
          type: string
          example: "ing.es"
      required:
        - name
        - web
        - swiftBicCode
    Mortgage:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        bankId:
          type: integer
          readOnly: true
        name:
          type: string
          example: "Hipoteca Naranja"
        interestRateType:
          type: string
          example: "FIJO"
        description:
          type: string
        apr:
          type: number
          example: 1.75
      required:
        - name
        - interestRateType
        - apr
paths:
  /banks/:
    get:
      summary: "Devuelve los datos de todos los bancos"
      operationId: "findAllBanks"
      responses:
        "200":
          description: "Lista de todos los bancos"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bank"
    post:
      summary: "Crea un nuevo banco"
      operationId: "createBank"
      security:
        - ApiKeyAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Bank"
        required: true
      responses:
        "201":
          description: "Nuevo banco creado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
  /banks/{bankId}:
    get:
      summary: "Devuelve los datos de un banco concreto"
      operationId: "findBankById"
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "Información del banco solicitado"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "404":
          description: "Banco no encontrado"
    put:
      summary: "Modifica los datos de un banco concreto"
      operationId: "updateBank"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Bank"
        required: true
      responses:
        "200":
          description: "Información del banco modificada"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bank"
        "404":
          description: "Banco no encontrado"
    delete:
      summary: "Borra un banco concreto"
      operationId: "deleteBank"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "204":
          description: "Banco eliminado correctamente"
        "404":
          description: "Banco no encontrado"
  /banks/{bankId}/mortgages/:
    get:
      summary: "Devuelve los datos de todas las hipotecas ofertadas por un banco"
      operationId: "findAll"
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "Lista de hipotecas ofertadas por un banco"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Mortgage"
    post:
      summary: "Crea una nueva hipoteca asociada a un banco"
      operationId: "create"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mortgage"
        required: true
      responses:
        "200":
          description: "Nueva hipoteca creada"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/Mortgage"
  /banks/{bankId}/mortgages/{mortgageId}:
    get:
      summary: "Devuelve los datos de una hipoteca concreta ofertada por un banco"
      operationId: "findById"
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "mortgageId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "200":
          description: "Información de una hipoteca ofertada por un banco"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/Mortgage"
        "404":
          description: "Hipoteca no encontrada"
    put:
      summary: "Modifica los datos de una hipoteca concreta ofertada por un banco"
      operationId: "update"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "mortgageId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Mortgage"
        required: true
      responses:
        "200":
          description: "Información de la hipoteca modificada"
          content:
            'application/json':
              schema:
                $ref: "#/components/schemas/Mortgage"
        "404":
          description: "Hipoteca no encontrada"
    delete:
      summary: "Elimina una hipoteca concreta ofertada por un banco"
      operationId: "delete"
      security:
        - ApiKeyAuth: []
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "mortgageId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "204":
          description: "Hipoteca eliminada correctamente"
        "404":
          description: "Hipoteca no encontrada"
  /banks/{bankId}/mortgages/{mortgageId}/simulate:
    get:
      summary: "Simula una hipoteca, calculando la cuota mensual asociada"
      operationId: "simulateMortgage"
      parameters:
        - name: "bankId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "mortgageId"
          in: "path"
          required: true
          schema:
            type: "integer"
            format: "int32"
        - name: "principal"
          in: "query"
          required: true
          schema:
            type: "number"
        - name: "years"
          in: "query"
          required: true
          schema:
            type: "integer"
            format: "int32"
      responses:
        "202":
          description: "Cuota mensual calculada"
        "404":
          description: "Hipoteca no encontrada"