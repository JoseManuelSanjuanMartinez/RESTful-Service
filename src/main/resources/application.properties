# General configuration
spring.application.name=BanksProject
spring.profiles.active=local

# Attachments storage
attachments.storage.path=./data/attachments

# Enforce 10MB limit for multipart uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Azure AI Document Intelligence Configuration
azure.documentintelligence.endpoint=https://document-intelligence-instance-123456789.cognitiveservices.azure.com/

# Azure OpenAI Foundry
azure.openai.endpoint=https://language-processing-instance-123546789.openai.azure.com/
azure.openai.deployment-name=gpt-4o-mini